# Data Validator configuration
# Relative input/output paths resolve against the current working directory.

input: sample/data_pendaftaran.xlsx
output: output/validation_report.xlsx

rules:
  Nama Lengkap:
    - type: required

  Email:
    - type: required
    - type: email

  No HP:
    - type: required
    - type: phone
      min_digits: 10
      max_digits: 15

  Tanggal Lahir:
    - type: date_range
      min: "1950-01-01"
      max: "2010-12-31"

  Umur:
    - type: number_range
      min: 17
      max: 65

  NIK:
    - type: regex
      pattern: "^\\d{16}$"
      message: "NIK harus 16 digit angka"

  Status:
    - type: in_list
      values: ["Aktif", "Nonaktif", "Pending"]
